version: 2

project_name: flow

before:
  hooks:
    - go mod tidy
    # fang registers a hidden `man` command; generate the pages from it.
    - sh -c 'go run ./cmd/flow man > flow.1 2>/dev/null || true'
    # Completions are generated here, not by running the binary at install
    # time: the released binary is ad-hoc signed rather than notarized, so
    # Gatekeeper SIGKILLs it the first time Homebrew executes it.
    - mkdir -p completions
    - sh -c 'go run ./cmd/flow completion bash > completions/flow.bash'
    - sh -c 'go run ./cmd/flow completion zsh > completions/flow.zsh'
    - sh -c 'go run ./cmd/flow completion fish > completions/flow.fish'

builds:
  - id: flow
    main: ./cmd/flow
    binary: flow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

universal_binaries:
  - id: flow
    replace: true
    name_template: flow

archives:
  - id: flow
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: flow.1
        dst: man/man1/flow.1
        info:
          mode: 0644
      - src: completions/flow.*
        dst: completions
        info:
          mode: 0644

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99

homebrew_casks:
  - name: flow
    repository:
      owner: idosaban-scaleops
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/idosaban-scaleops/flow
    description: Personal workflow CLI for ticket-driven development
    binaries:
      - flow
    manpages:
      - man/man1/flow.1
    completions:
      bash: completions/flow.bash
      zsh: completions/flow.zsh
      fish: completions/flow.fish
    # The binary is not signed or notarized, so without this macOS Gatekeeper
    # refuses to run it ("flow is damaged and cannot be opened").
    #
    # Homebrew deprecated the Ruby `postflight` block that `hooks.post.install`
    # generates in favour of the declarative `postflight_steps`, which GoReleaser
    # cannot emit yet (goreleaser/goreleaser#6870). Until it can, write the stanza
    # ourselves. `{{staged_path}}` is a Homebrew token, not a GoReleaser one, so it
    # is escaped to reach the cask verbatim. `must_succeed: false` keeps the old
    # hook's tolerance: a failed xattr never fails the install.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/flow"], must_succeed: false
        end
      end

release:
  prerelease: auto
