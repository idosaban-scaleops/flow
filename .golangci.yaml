version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    # The PRNone/PRUnknown invariant is the reason this is on: a switch over
    # PRState, Phase or Conclusion that quietly omits a case is exactly the
    # collapse the domain rules forbid, and only a linter catches it on every
    # future switch.
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    staticcheck:
      checks:
        - all
        # Naming an embedded struct explicitly (result.Entry.Slug) is clearer
        # than relying on promotion when the embedding is an implementation
        # detail of the payload type.
        - -QF1008
    errcheck:
      check-type-assertions: true
    exhaustive:
      # Deliberately strict. A `default:` clause would otherwise exempt the
      # switch, and the switches this linter is here for — the ones over
      # ghapi.PRState — all have one. Exempting them would leave PRNone and
      # PRUnknown free to collapse into a single branch, which is the one thing
      # the domain rules forbid. Keep the `default:` as the guard against an
      # out-of-range value, and name every real case alongside it.
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        # `if err := f(); err != nil` inside a function that already has an err
        # is the idiom this codebase uses everywhere; flagging it is noise.
        - shadow
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - whyNoLint

  exclusions:
    rules:
      # Writing to the terminal is the whole job of internal/output, and a
      # failed write to stdout is not something a CLI can act on.
      - path: internal/(output|ciwait|cli)/
        linters:
          - errcheck
        source: fmt\.Fprint

      # Tests are allowed to be blunt: unchecked writes to a buffer, long
      # table-driven functions, and hard-coded credentials in fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/idosaban-scaleops/flow
